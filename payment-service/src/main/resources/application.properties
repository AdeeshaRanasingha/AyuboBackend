spring.application.name=payment-service

server.port=8088

# Your Stripe Secret Key
stripe.api.key=${STRIPE_API_KEY:}

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/ayubo_payments?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate (Auto-create tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Service integration
services.appointment.base-url=http://localhost:8082
services.auth.base-url=http://localhost:8081
services.notification.base-url=http://localhost:8086

app.frontend-base-url=http://localhost:5173
