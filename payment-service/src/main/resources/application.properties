spring.application.name=payment-service

server.port=8088

# Your Stripe Secret Key
stripe.api.key=${STRIPE_API_KEY:}

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ayubo_payments?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate (Auto-create tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Service integration
services.appointment.base-url=${SERVICES_APPOINTMENT_BASE_URL:http://localhost:8082}
services.auth.base-url=${SERVICES_AUTH_BASE_URL:http://localhost:8081}
services.notification.base-url=${SERVICES_NOTIFICATION_BASE_URL:http://localhost:8086}

app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
