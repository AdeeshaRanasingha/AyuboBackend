version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: appointment-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Indiwari@2002
      MYSQL_DATABASE: ayubo_appointment_db
    ports:
      - "3307:3306"
    volumes:
      - appointment_mysql_data:/var/lib/mysql

  appointment-service:
    build: .
    container_name: appointment-service
    depends_on:
      - mysql
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ayubo_appointment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Indiwari@2002
      SERVICES_NOTIFICATION_BASE_URL: http://host.docker.internal:8086

volumes:
  appointment_mysql_data:
