server:
  port: 8082

jwt:
  secret: "0123456789abcdef0123456789abcdef0123456789abcdef01"

appointment:
  dev:
    allow-token-endpoint: true
  security:
    provider-doctor-id-by-email: {}

spring:
  application:
    name: appointment-service

  sql:
    init:
      mode: never

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ayubo_appointment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Indiwari@2002}

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

services:
  auth:
    base-url: ${SERVICES_AUTH_BASE_URL:http://localhost:8085}
    fallback-base-url: ${SERVICES_AUTH_FALLBACK_BASE_URL:http://host.docker.internal:8085}
  notification:
    base-url: ${SERVICES_NOTIFICATION_BASE_URL:http://localhost:8086}

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  integration:
    internal-token: change-me-dev-internal-token

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
