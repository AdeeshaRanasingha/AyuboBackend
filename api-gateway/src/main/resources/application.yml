server:
  port: 8085
  tomcat:
    max-http-form-post-size: 10MB

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:

            - Path=/api/auth/**, /api/provider/**, /api/patient/**, /api/admin/**, /api/schedule/**

        - id: ai-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/ai/**

        - id: payment-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/payment/**


        
        - id: appointment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/appointments/**


