server:
  port: 8085

spring:
  codec:
    max-in-memory-size: 10MB
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**, /api/provider/**, /api/patient/**, /api/admin/**, /api/schedule/**

        - id: ai-service
          uri: ${AI_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/ai/**

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/api/payment/**

        - id: telemedicine-dev
          uri: ${TELEMEDICINE_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/telemedicine/dev/issue-token

        - id: telemedicine-service
          uri: ${TELEMEDICINE_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/telemedicine/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/notifications/**

        - id: queue-service
          uri: ${QUEUE_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/api/queue/**

        - id: appointment-service
          uri: ${APPOINTMENT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/appointments/**
