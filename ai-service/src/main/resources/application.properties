server.port=8083
spring.application.name=ai-service

# Connect Gemini using the OpenAI adapter
gemini.api.key=${GEMINI_API_KEY:}

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ayubo_ai_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Indiwari@2002}

# Hibernate Settings (Automatically creates the tables for you!)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
