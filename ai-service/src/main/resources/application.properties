server.port=8083
spring.application.name=ai-service

# Connect Gemini using the OpenAI adapter
gemini.api.key=${GEMINI_API_KEY}

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/ayubo_ai_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234

# Hibernate Settings (Automatically creates the tables for you!)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true