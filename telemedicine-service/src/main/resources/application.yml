server:
  port: 8087

jwt:
  secret: "0123456789abcdef0123456789abcdef0123456789abcdef01"

telemedicine:
  dev:
    allow-token-endpoint: true
  jitsi:
    base-url: https://meet.jit.si
  security:
    provider-doctor-id-by-email: {}

services:
  auth:
    base-url: http://localhost:8090
  appointment:
    base-url: http://localhost:8082

spring:
  application:
    name: telemedicine-service
  datasource:
    url: jdbc:mysql://localhost:3306/ayubo_telemedicine_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
